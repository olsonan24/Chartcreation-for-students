name: Verify student app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Aionis shared contracts and development privacy
        run: npm run validate:aionis
        env:
          AIONIS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Validate existing token workflow
        run: node .agents/skills/aionis-ai-workflow/scripts/verify-workflow.mjs
      - name: Test telemetry privacy
        run: node --test .agents/skills/aionis-ai-workflow/scripts/telemetry.test.mjs
      - run: npm run lint
      - run: npm test
